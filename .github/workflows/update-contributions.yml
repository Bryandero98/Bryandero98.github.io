name: Update contributions data

on:
  schedule:
    - cron: "0 5 * * *" # todos los días 05:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate contributions.json + activity charts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-contributions.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json assets/activity-dark.svg assets/activity-light.svg
          git diff --cached --quiet || git commit -m "chore: refresh contributions data [skip ci]"
          git push
